name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned version → setup-bun auto-caches the Bun binary (ndr:0128)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun test

      # oxc stack: oxlint + oxfmt, not eslint/prettier (ndr:0132)
      - run: bun run lint
      - run: bun run format:check

      - run: bun run typecheck

      - run: bun run validate:plugin

      # smoke: bun build --compile on the ubuntu runner (ndr:0128
      # bun-build-targets-stable assumption); artifact not uploaded
      - run: bun run build

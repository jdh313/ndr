name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned version → setup-bun auto-caches the Bun binary (ndr:0128)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun test

      # oxc stack: oxlint + oxfmt, not eslint/prettier (ndr:0132)
      - run: bun run lint
      - run: bun run format:check

      - run: bun run typecheck

      # smoke: bun build --compile on the ubuntu runner (ndr:0128
      # bun-build-targets-stable assumption); artifact not uploaded
      - run: bun run build

  # The plugin manifests under marketplaces/ are committed compiler output.
  # This job recompiles them through a pinned AgentForge and fails on any
  # difference, so a hand-edit or a stale sync cannot reach main.
  #
  # Runs on fork PRs too: the release binary download below needs no secret
  # and nothing here is withheld from a fork run.
  marketplace:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pinned deliberately by version + sha256 of the release binary
      # (immutable like the old SHA checkout pin, but no checkout/toolchain
      # needed). The `agentforge` on a dev machine's PATH is a symlink into
      # ~/Projects/agentforge/dist and is NOT this compiler -- compiling
      # through it locally can produce output this job rejects.
      AGENTFORGE_VERSION: 0.2.0
      AGENTFORGE_SHA256: 47f06c4f1baf7bed04e137ab6c2ca1a4fbab10a7c6f93a34db74f4e94d8c337b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned AgentForge
        run: |
          curl -fsSLO "https://github.com/jdh313/agentforge/releases/download/v${AGENTFORGE_VERSION}/agentforge-linux-x64"
          echo "${AGENTFORGE_SHA256}  agentforge-linux-x64" | sha256sum -c
          chmod +x agentforge-linux-x64
          mkdir -p "$HOME/.local/bin" && mv agentforge-linux-x64 "$HOME/.local/bin/agentforge"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Validates the exact committed bytes both runtimes load, rather than a
      # fresh temporary compile.
      - name: Check committed publications for drift
        run: agentforge check MARKETPLACE.yaml --out marketplaces

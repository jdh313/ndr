name: Release (beta)

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Beta lane of the two-lane release model: prerelease versioning
      # (vX.Y.Z-beta.N) with its own config/manifest/changelog so the stable
      # lane on main never sees beta versions in its manifest. After every
      # STABLE release, back-merge main -> dev and sync
      # .release-please-manifest-dev.json to the stable version (see
      # .claude/rules/branch-workflow.md).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          target-branch: dev
          config-file: release-please-config-dev.json
          manifest-file: .release-please-manifest-dev.json

  # Same native-runner matrix as release.yml (see that file for why builds
  # are not cross-compiled); duplicated because the two lanes trigger on
  # different branches.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: ndr-linux-x64
          - os: ubuntu-24.04-arm
            asset_name: ndr-linux-arm64
          - os: macos-13
            asset_name: ndr-darwin-x64
          - os: macos-latest
            asset_name: ndr-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

      - run: bun install --frozen-lockfile

      - name: Build binary
        env:
          BUN_NO_CODESIGN_MACHO_BINARY: 1
        run: bun run build

      - name: Ad-hoc codesign
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/ndr

      - name: Rename binary
        run: mv dist/ndr dist/${{ matrix.asset_name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/${{ matrix.asset_name }}

# Topics — finer-grained, within an area.
# Finite list, hand-edited. Capture skill refuses unknown values.
# To add: edit this file.
# Seeded from the vault taxonomy with the values the migrated NDR-system
# atoms use (JUN-176).
- ci-strategy          # CI platform, gates, caching, trigger conventions
- commit-convention    # how commit messages are authored/enforced
- data-modelling       # schema, dimensions, facts, grain
- deployment           # how things ship / run / migrate
- discipline           # what humans must do without tool support
- file-organization    # library/media file naming and directory layout conventions
- framework            # backend/frontend framework choice
- granularity          # atomic vs bundled, file vs directory
- lint-format          # source-code lint/format tooling (oxlint, biome, eslint+prettier)
- mvp-scope            # what's in / out of MVP
- read-side            # context-loading, retrieval, supersession resolution
- referencing          # how to reference decisions / artifacts
- repo-shape           # monorepo vs split, package layout
- substrate            # storage choice (markdown, graph DB, CMS)
- supersession         # decision revision / chain logic
- test-method          # how we validate the discipline
- tool-routing         # which tool to use for which vault operation
- write-side           # capture, materialization, schema enforcement
